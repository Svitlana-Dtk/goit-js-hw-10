<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snackbar</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/modern-normalize/3.0.1/modern-normalize.min.css"
    />
    <script type="module" crossorigin src="/goit-js-hw-10/2-snackbar.js"></script>
    <link rel="modulepreload" crossorigin href="/goit-js-hw-10/assets/modulepreload-polyfill-B5Qt9EMX.js">
    <link rel="modulepreload" crossorigin href="/goit-js-hw-10/assets/vendor-BbbuE1sJ.js">
    <link rel="stylesheet" crossorigin href="/goit-js-hw-10/assets/vendor-CZjNVMTf.css">
    <link rel="stylesheet" crossorigin href="/goit-js-hw-10/assets/styles-n8Mpvpt1.css">
  </head>
  <body>
    <main>
      <section class="snackbar-section">
        <div class="container snackbar">
          <a class="link-back" href="./index.html">Go back</a>
          <h1 class="visually-hidden">Snackbar</h1>
          <form class="form">
            <label class="label-delay">
              Delay (ms)
              <input class="input-delay" type="number" name="delay" required />
            </label>
            <fieldset class="radio-choose">
              <legend>State</legend>
              <label>
                <input type="radio" name="state" value="fulfilled" required />
                Fulfilled
              </label>
              <label>
                <input type="radio" name="state" value="rejected" required />
                Rejected
              </label>
            </fieldset>
            <button class="btn-form" type="submit">Create notification</button>
          </form>
        </div>
      </section>
    </main>
  </body>
</html>
